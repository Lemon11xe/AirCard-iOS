name: Build AirCard IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          set -o pipefail
          chmod +x build-ipa.sh
          ./build-ipa.sh 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AirCard-iOS
          path: build/AirCard-iOS.ipa
